<div class="section">
  <div class="body">
    <div class="body-left">
      <img ngSrc="./assets/southcarolina_1.webp" height="300" width="300" class="body-left-image-left" alt="southcarolina_1.webp">
      <img ngSrc="./assets/southcarolina_2.webp" height="300" width="300" class="body-left-image-right" alt="southcarolina_2.webp">
      <img ngSrc="./assets/southcarolina_3.webp" height="300" width="300" class="body-left-image-left" alt="southcarolina_3.webp">
    </div>
    <div class="body-right" appScrollReveal>
      <div>
        <h1 class="body-right-title"><a href="https://sc.edu/">{{ pageData.educationPage.collegeTitle }}</a></h1>
        <h2 class="body-right-header">{{ pageData.educationPage.collegeDuration }}</h2>
        <p class="body-right-body">{{ pageData.educationPage.collegeDescription }}</p>
      </div>
      <div>
        <h2 class="body-right-header">{{ pageData.educationPage.collegeActivitiesTitle }}</h2>
        <div *ngFor="let activity of pageData.educationPage.extracurriculars" class="ml-4">
          <li class="body-right-item">
            <a class="body-right-link" href="{{ activity.href }}">
              {{ activity.description }}
            </a>
          </li>
        </div>
      </div>
    </div>
  </div>
</div>
